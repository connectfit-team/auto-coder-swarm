<!DOCTYPE html>
<html>
<head>
    <title>Auto-Coder Swarm 관리 대시보드</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: #f4f7f6; margin: 0; display: flex; color: #333; transition: all 0.3s ease; }
        
        .sidebar { width: 250px; background: #2c3e50; color: white; height: 100vh; padding: 20px; box-sizing: border-box; position: fixed; transition: all 0.3s ease; z-index: 1000; }
        .sidebar.collapsed { width: 70px; padding: 20px 10px; }
        
        .sidebar h2 { margin-top: 0; color: #3498db; font-size: 1.5em; white-space: nowrap; overflow: hidden; }
        .sidebar.collapsed h2 { font-size: 1.2em; text-align: center; }
        
        .sidebar ul { list-style: none; padding: 0; margin-top: 30px; }
        .sidebar li { margin: 20px 0; }
        
        .sidebar a { color: #bdc3c7; text-decoration: none; font-weight: 500; transition: 0.3s; display: flex; align-items: center; white-space: nowrap; }
        .sidebar a:hover { color: white; }
        
        .sidebar .icon { min-width: 30px; font-size: 1.2em; margin-right: 15px; text-align: center; }
        .sidebar.collapsed .icon { margin-right: 0; }
        .sidebar.collapsed .text { display: none; }
        
        .content { margin-left: 250px; flex: 1; padding: 40px; box-sizing: border-box; transition: all 0.3s ease; }
        .content.collapsed { margin-left: 70px; }
        
        .toggle-btn { position: absolute; top: 15px; right: -15px; width: 30px; height: 30px; background: #3498db; border: none; border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 1001; }
        .sidebar.collapsed .toggle-btn { right: -15px; }

        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .card h3 { margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        
        .status-PENDING { background: #fef9e7; color: #f39c12; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .status-RUNNING { background: #ebf5fb; color: #3498db; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .status-COMPLETED { background: #e9f7ef; color: #2ecc71; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .status-FAILED { background: #fdedec; color: #e74c3c; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .status-CANCELLED { background: #f2f3f4; color: #7f8c8d; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .status-WAITING_APPROVAL { background: #e8f8f5; color: #1abc9c; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; }
        pre { background: #2d3436; color: #dfe6e9; padding: 20px; border-radius: 8px; overflow-x: auto; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; line-height: 1.5; }
        textarea { width: 100%; height: 500px; font-family: monospace; border: 1px solid #ddd; border-radius: 8px; padding: 15px; box-sizing: border-box; font-size: 14px; }
        
        .btn { display: inline-block; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; background: #3498db; color: white; font-weight: 600; text-decoration: none; transition: 0.3s; }
        .btn:hover { background: #2980b9; transform: translateY(-1px); }
        .btn-save { background: #2ecc71; margin-top: 15px; }
        .btn-save:hover { background: #27ae60; }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <button class="toggle-btn" onclick="toggleSidebar()" id="toggleBtn">◀</button>
        <h2 id="sidebarTitle">Swarm Dash</h2>
        <ul>
            <li><a href="/"><span class="icon">🏠</span><span class="text">홈 대시보드</span></a></li>
            <li><a href="/projects"><span class="icon">📘</span><span class="text">프로젝트 명세</span></a></li>
            <li><a href="/progress"><span class="icon">📈</span><span class="text">진행 상황</span></a></li>
            <li><a href="/logs"><span class="icon">📝</span><span class="text">Swarm 로그 (Git)</span></a></li>
            <li><a href="/settings"><span class="icon">⚙️</span><span class="text">시스템 설정</span></a></li>
        </ul>
    </div>
    <div class="content" id="content">
        {{template "content" .}}
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('content');
            const btn = document.getElementById('toggleBtn');
            const title = document.getElementById('sidebarTitle');
            
            sidebar.classList.toggle('collapsed');
            content.classList.toggle('collapsed');
            
            if (sidebar.classList.contains('collapsed')) {
                btn.innerText = '▶';
                title.innerText = 'SD';
                localStorage.setItem('sidebarCollapsed', 'true');
            } else {
                btn.innerText = '◀';
                title.innerText = 'Swarm Dash';
                localStorage.setItem('sidebarCollapsed', 'false');
            }
        }

        // Restore state
        window.onload = () => {
            if (localStorage.getItem('sidebarCollapsed') === 'true') {
                const sidebar = document.getElementById('sidebar');
                const content = document.getElementById('content');
                const btn = document.getElementById('toggleBtn');
                const title = document.getElementById('sidebarTitle');
                
                sidebar.classList.add('collapsed');
                content.classList.add('collapsed');
                btn.innerText = '▶';
                title.innerText = 'SD';
            }
        };
    </script>
</body>
</html>
