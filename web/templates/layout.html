<!DOCTYPE html>
<html>
<head>
    <title>Auto-Coder Swarm 관리 대시보드</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: #f4f7f6; margin: 0; display: flex; color: #333; }
        .sidebar { width: 250px; background: #2c3e50; color: white; height: 100vh; padding: 20px; box-sizing: border-box; position: fixed; }
        .sidebar h2 { margin-top: 0; color: #3498db; font-size: 1.5em; }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar li { margin: 15px 0; }
        .sidebar a { color: #bdc3c7; text-decoration: none; font-weight: 500; transition: 0.3s; }
        .sidebar a:hover { color: white; padding-left: 5px; }
        .content { margin-left: 250px; flex: 1; padding: 40px; box-sizing: border-box; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .card h3 { margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .status-PENDING { background: #fef9e7; color: #f39c12; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .status-RUNNING { background: #ebf5fb; color: #3498db; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .status-COMPLETED { background: #e9f7ef; color: #2ecc71; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .status-FAILED { background: #fdedec; color: #e74c3c; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .status-WAITING_APPROVAL { background: #e8f8f5; color: #1abc9c; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; }
        pre { background: #2d3436; color: #dfe6e9; padding: 20px; border-radius: 8px; overflow-x: auto; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; line-height: 1.5; }
        textarea { width: 100%; height: 500px; font-family: monospace; border: 1px solid #ddd; border-radius: 8px; padding: 15px; box-sizing: border-box; font-size: 14px; }
        .btn { display: inline-block; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; background: #3498db; color: white; font-weight: 600; text-decoration: none; transition: 0.3s; }
        .btn:hover { background: #2980b9; transform: translateY(-1px); }
        .btn-save { background: #2ecc71; margin-top: 15px; }
        .btn-save:hover { background: #27ae60; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Swarm Dash</h2>
        <ul>
            <li><a href="/">🏠 홈 대시보드</a></li>
            <li><a href="/projects">📘 프로젝트 명세</a></li>
            <li><a href="/progress">📈 진행 상황</a></li>
            <li><a href="/logs">📝 Swarm 로그 (Git)</a></li>
            <li><a href="/settings">⚙️ 시스템 설정</a></li>
        </ul>
    </div>
    <div class="content">
        {{template "content" .}}
    </div>
</body>
</html>
